[project]
name = "deep-research-agent"
version = "0.1.0"
description = "LangGraph-based deep research and fact-check workflow"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2.20",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langchain>=1.5.0",
  "anthropic>=0.52.0",
  "google-genai>=3.3.0",
  "tavily-python>=0.5.0",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
  "python-dotenv>=1.2.4",
  "fastapi>=0.162.5",
  "uvicorn>=0.34.0",
  "chromadb>=1.5.9",
  "fonttools>=4.0.0",
  "pypdf>=5.0.0",
  "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
